name: Apply V2.9.4 Home Update

on:
  push:
    branches: [main]
    paths:
      - 'update_home_v294.py'
      - '.github/workflows/apply-home-v294.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply update
        run: python update_home_v294.py
      - name: Commit index
        run: |
          git config user.name "visiteen-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update home screen explanatory content to V2.9.4"
          git push
