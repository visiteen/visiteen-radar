name: Apply Safe V2.9.6 Manager Edit

on:
  push:
    paths:
      - '.github/workflows/apply-v296-clean.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply clean patch
        run: python apply_v296_clean.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/radar.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/radar.js
      - name: Commit V2.9.6
        run: |
          git config user.name "Visiteen Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy safe V2.9.6 manager edit"
          git push
