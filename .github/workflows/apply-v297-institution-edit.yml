name: Apply Safe V2.9.7 Institution Edit

on:
  push:
    paths:
      - '.github/workflows/apply-v297-institution-edit.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply institution edit patch
        run: python3 apply_v297_institution_edit.py
      - name: Validate generated JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,re.S|re.I)
          Path('/tmp/visiteen-check.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/visiteen-check.js
      - name: Verify V2.9.7 markers
        run: |
          grep -q "data-inst-edit" index.html
          grep -q "superadmin_update_institution" index.html
          grep -q "Kurum Bilgilerini Düzenle" index.html
      - name: Commit validated V2.9.7
        run: |
          git config user.name "Visiteen Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Deploy safe V2.9.7 institution edit"
          git push
