/* V2: kategori yorumları ve PDF deneyimi */
.category-profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.category-profile-card{background:#fff;border:1px solid #e2e8f1;border-radius:22px;padding:20px;box-shadow:0 10px 28px rgba(7,38,91,.07)}
.category-profile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.category-profile-head>div{min-width:0}.category-kicker{display:block;color:var(--navy);font-size:15px;font-weight:850;line-height:1.35;margin-bottom:10px}
.category-profile-head strong{font-size:36px;color:var(--navy);letter-spacing:-.03em}.category-profile-head strong small{font-size:14px;color:var(--muted);font-weight:700;margin-left:3px}
.category-level{flex:0 0 auto;padding:7px 10px;border-radius:999px;background:#fff0e4;color:#a94400;font-weight:850;font-size:11px;white-space:nowrap}
.category-profile-card p{color:#52607d;line-height:1.55;font-size:13px;margin:13px 0 0}
.category-bar{height:9px;background:#edf1f6;border-radius:999px;overflow:hidden;margin-top:12px}.category-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--orange));border-radius:999px}
.category-delta{margin-top:13px;padding:9px 11px;border-radius:12px;font-size:11px;font-weight:800}.category-delta.positive{background:#e9f7f1;color:#117356}.category-delta.negative{background:#EFFAF8;color:#a43f31}
.metric-comment{grid-column:1/-1;color:var(--muted);font-size:11px;line-height:1.45;margin-top:-2px}.metric-comment b{color:var(--navy)}
.action-grid-v2{grid-template-columns:repeat(4,1fr)}

.pdf-modal-panel{width:min(1180px,100%);height:min(94vh,980px);background:#f4f7fb;border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.38);display:flex;flex-direction:column}

.pdf-toolbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.pdf-toolbar-actions .btn{padding:9px 12px;font-size:12px}
.pdf-close{width:38px;height:38px;border-radius:12px;border:1px solid #dce4ef;background:#fff;color:var(--navy);font-size:25px;line-height:1;display:grid;place-items:center}

.pdf-preview-page img{display:block;width:100%;height:auto;background:#fff}

/* V2.1 • 30 soru, sesli akış ve başlangıç geri sayımı */
.sound-toggle{
  border:1px solid #dfe6f0;background:#fff;border-radius:999px;padding:10px 13px;
  color:var(--navy);font-weight:800;font-size:12px;white-space:nowrap;cursor:pointer;
  box-shadow:0 6px 18px rgba(6,38,95,.06)
}
.sound-toggle:hover{border-color:#ffb37e;background:#fff8f2}
.start-countdown{
  max-width:720px;margin:55px auto;text-align:center;padding:48px 38px;position:relative;overflow:hidden
}
.countdown-kicker,.awareness-tag{
  display:inline-flex;padding:8px 12px;border-radius:999px;background:#EEF9F9;color:#a74700;
  font-size:11px;font-weight:900;letter-spacing:.08em
}
.countdown-orb{
  width:190px;height:190px;margin:30px auto 18px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--navy),#123f86);color:#fff;font-size:70px;font-weight:950;
  box-shadow:0 24px 70px rgba(6,38,95,.22), inset 0 0 0 10px rgba(255,255,255,.08)
}
.countdown-orb.pop{animation:countPop .42s ease}
@keyframes countPop{0%{transform:scale(.78);opacity:.3}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.start-countdown h2{color:var(--navy);font-size:34px;margin:8px 0}
.start-countdown p{color:#4d5c78;font-size:18px;line-height:1.55}
.countdown-hint{margin:22px auto 0;max-width:560px;padding:14px 16px;border-radius:16px;background:#f4f7fb;color:#5a6780;font-size:13px;line-height:1.45}
.timer.tick{animation:timerTick .34s ease}
@keyframes timerTick{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.awareness-tag{margin-top:13px;background:#eef4ff;color:var(--navy);letter-spacing:0}
.awareness-tip{margin:20px auto 24px;padding:14px 16px;border-radius:16px;background:#f5f7fb;color:#5e6a82;font-size:13px;line-height:1.45;max-width:610px}
.awareness .sound-toggle{margin-top:18px}
.quiz-top{flex-wrap:wrap}
@media(max-width:720px){
  .progress-wrap{flex-basis:100%}
  .sound-toggle{padding:8px 10px}
  .start-countdown{margin:25px auto;padding:34px 20px}
  .countdown-orb{width:150px;height:150px;font-size:58px}
}

@media(max-width:700px){
  .pdf-page-viewer{padding:10px;gap:12px}
  .pdf-preview-page{border-radius:5px}
  .pdf-page-number{font-size:9px;padding:5px 8px}
}

  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  max-width:900px;
}

  padding:13px 14px;
  border-radius:14px;
  background:#f5f8fc;
  border-left:4px solid #19D5C1;
  display:flex;
  flex-direction:column;
  gap:5px;

  color:#5B2CFF;
  font-size:12px;
  letter-spacing:.02em;
}
.pattern-insight span{
  color:#53617d;
  font-size:12.5px;
  line-height:1.5;

.dash-report-btn:hover{
  transform:translateY(-1px);
  background:linear-gradient(135deg,rgba(15,67,203,.14),rgba(91,44,255,.15));
}
.dash-report-btn .ui-icon{
  width:20px;height:20px;
  grid-row:1/3;
  color:#5B2CFF;
}
.dash-report-btn span{
  display:block;
  font-size:11px;
  font-weight:950;
  color:#3E2BC8;
}
.dash-report-btn small{
  display:block;
  margin-top:2px;
  font-size:9px;
  font-weight:800;
  color:#74819A;
}
.dash-report-btn:disabled{opacity:.6;cursor:wait}


/* V2.9.2 • Akıllı Yönetim Merkezi */
.management-center{
  margin-top:20px;padding:24px;border-radius:26px;
  background:linear-gradient(180deg,#FFFFFF,#F7F9FE);
  border:1px solid #E0E7F4;
  box-shadow:0 14px 34px rgba(24,45,105,.07)
}
.management-center-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.management-center-head h2{margin:0;color:#4127C9;font-size:24px}
.management-center-head p{margin:6px 0 0;color:#6D7891;font-size:12px}
.management-tabs{display:flex;gap:8px;flex-wrap:wrap}
.management-tab{
  border:1px solid #DCE4F2;background:#fff;color:#40517B;
  border-radius:12px;padding:9px 12px;font-size:11px;font-weight:900;cursor:pointer
}
.management-tab.active{background:linear-gradient(135deg,#0F43CB,#6B2CF5);color:#fff;border-color:transparent}
.management-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.management-card{
  padding:18px;border-radius:18px;background:#fff;border:1px solid #E2E8F3;
  box-shadow:0 8px 18px rgba(22,43,99,.04)
}
.management-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.management-card h3{margin:0;color:#173A8E;font-size:16px}
.management-card p{margin:5px 0 0;color:#6C7891;font-size:11px}
.management-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.management-chip{
  display:inline-flex;padding:6px 9px;border-radius:999px;background:#F0F4FB;color:#52617D;
  font-size:10px;font-weight:850
}
.management-chip.active{background:#E9F9F4;color:#15765C}
.management-chip.passive{background:#FFF0EF;color:#B2473B}
.management-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.management-action{
  border:1px solid #DCE4F2;background:#fff;color:#294491;border-radius:11px;padding:8px 10px;
  font-size:10px;font-weight:900;cursor:pointer
}
.management-action.primary{background:#EEF3FF;border-color:#D8E2FF;color:#4A2FD5}
.management-action.danger{background:#FFF2F0;border-color:#FFD9D3;color:#B7473B}
.management-action.success{background:#EAF9F4;border-color:#CFEFE4;color:#14765E}
.management-search{
  width:100%;height:44px;border-radius:13px;border:1px solid #DDE5F2;background:#fff;
  padding:0 13px;color:#2D3E68;margin-bottom:14px
}
.security-panel{
  margin-top:18px;padding:18px;border-radius:18px;
  background:linear-gradient(135deg,rgba(15,67,203,.07),rgba(91,44,255,.08));
  border:1px solid rgba(91,44,255,.15)
}
.security-panel h3{margin:0;color:#4B2DCE;font-size:17px}
.security-panel p{margin:6px 0 14px;color:#6D7891;font-size:11px}
.security-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
.security-grid label{display:block;color:#596783;font-size:10px;font-weight:900}
.security-grid input{width:100%;height:42px;margin-top:6px;border-radius:11px;border:1px solid #DCE4F1;padding:0 11px}
.management-empty{padding:24px;text-align:center;color:#7A879C}
@media(max-width:900px){
  .management-grid{grid-template-columns:1fr}
  .security-grid{grid-template-columns:1fr}
}


/* V2.9.3 • Gelişim Karnesi erişim düzeltmesi */
.dash-report-btn{
  position:relative;
  z-index:2;
}
.dash-report-btn:hover{
  box-shadow:0 8px 18px rgba(74,47,213,.12);
}
.dash-report-btn:disabled{
  opacity:.62!important;
  pointer-events:none;
}


/* V2.9.4 • Ana ekran açıklayıcı bilgi kartları */
.hero-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.hero-info-card{position:relative;z-index:2;padding:16px 17px;border-radius:18px;background:linear-gradient(145deg,rgba(91,44,255,.055),rgba(15,67,203,.035));border:1px solid rgba(91,44,255,.13)}
.hero-info-card.academy{background:linear-gradient(145deg,rgba(25,213,193,.085),rgba(91,44,255,.045));border-color:rgba(25,190,175,.18)}
.hero-info-title{display:flex;align-items:center;gap:8px;color:#4F2AE8;font-size:13px;line-height:1.3}
.hero-info-card.academy .hero-info-title{color:#087F78}
.hero-info-title .ui-icon{width:18px;height:18px;flex:0 0 auto}
.hero-info-card p{margin:8px 0 0;color:#586582;font-size:12.5px;line-height:1.52}
.hero-info-card p b{color:#2E3E78}
@media(max-width:720px){.hero-info-grid{grid-template-columns:1fr}.hero-info-card{padding:14px 15px}}

</style>

function scoreBandIndex(score){ return score<40?0:score<55?1:score<70?2:score<85?3:4; }
function categoryAnswerPattern(session,key){
  if(!session?.answers?.length)return null;
  const qs=QUESTIONS.filter(q=>q.category===key);
  const rows=qs.map(q=>{
    const answer=session.answers.find(a=>a.questionId===q.id);
    return {questionId:q.id,score:Number(answer?.score??0),label:CATEGORY_DIMENSIONS[key]?.[q.id]||q.measuredReflex};
  });
  if(!rows.length)return null;
  const sortedLow=[...rows].sort((a,b)=>a.score-b.score||a.questionId-b.questionId);
  const sortedHigh=[...rows].sort((a,b)=>b.score-a.score||a.questionId-b.questionId);
  const min=sortedLow[0].score,max=sortedHigh[0].score,range=max-min;
  const lowGroup=sortedLow.filter(x=>x.score===min);
  const highGroup=sortedHigh.filter(x=>x.score===max);
  const weak=lowGroup[0],strong=highGroup[0];
  let text='';
  if(range===0){
    text=`Yanıt örüntün bu alanın beş alt boyutunda dengeli bir profil gösteriyor. ${weak.label}, diğer alt boyutlarla aynı düzeyde ilerliyor; gelişim çalışmasında alanı bütün olarak güçlendirmek daha anlamlı görünüyor.`;
  }else if(range===1){
    text=`Beş soruluk yanıt örüntünde görece güçlü yönün “${strong.label}”; bir sonraki gelişim odağın ise “${weak.label}”. Skorun genel seviyesini yükseltmek için özellikle bu iki alt boyut arasındaki dengeyi güçlendirmek yararlı olacaktır.`;
  }else{
    text=`Beş soruluk yanıt örüntün tek tip değil: “${strong.label}” daha güçlü bir refleks olarak öne çıkarken “${weak.label}” belirgin gelişim fırsatı gösteriyor. Aynı toplam skoru alan başka bir öğretmenden farklı olarak kişisel gelişim önceliğin bu alt boyut etrafında şekilleniyor.`;
  }
  return {rows,weak,strong,range,text};
}
function categoryInterpretation(key,score,session=null){
  const item=CATEGORY_INTERPRETATIONS[key]?.[scoreBandIndex(score)]||['Gelişim Profili','Bu alandaki eğilimin akademi çalışmalarıyla birlikte daha görünür hâle gelecektir.'];
  const pattern=categoryAnswerPattern(session,key);
  return {label:item[0],baseText:item[1],patternText:pattern?.text||'',text:pattern?`${item[1]} ${pattern.text}`:item[1],pattern};
}
function reflexLevel(score){return [
  {label:'Keşif Refleksi',color:'#b65300'},
  {label:'Gelişen Refleks',color:'#b07a00'},
  {label:'Uygulamaya Yakın Refleks',color:'#1b6e8c'},
  {label:'Güçlü Refleks',color:'#15845f'}
][Math.max(0,Math.min(3,Number(score)||0))];}
function answerScore(session,questionId){return session?.answers?.find(a=>a.questionId===questionId)?.score ?? null;}
function questionDevelopmentComment(question,score,preScore=null){
  const cat=category(question.category); const rl=reflexLevel(score??0);
  const base=[
    `Bu yanıt, “${question.measuredReflex}” alanında başlangıç/keşif düzeyinde bir eğilime işaret ediyor. ${cat.training} sırasında bu refleksi sınıf içinde uygulanabilir bir öğretmen davranışına dönüştürmek öncelikli gelişim fırsatın.`,
    `Bu yanıtta temel farkındalık görülüyor; ancak “${question.measuredReflex}” refleksi henüz sistematik bir uygulamaya dönüşmemiş. Bir sonraki adım, bu yaklaşımı somut bir ders görevi veya öğretmen kararına bağlamak.`,
    `“${question.measuredReflex}” alanında gelişen ve sınıfa taşınabilir bir refleks görünür durumda. Bunu daha tutarlı hâle getirmek için uygulama kriterini, öğrenme kanıtını ve geri bildirimi birlikte düşünmek yararlı olacaktır.`,
    `“${question.measuredReflex}” alanında güçlü ve sistematik bir pedagojik refleks gösteriyorsun. Akademi atölyesinde bu yaklaşımı örnek ürün ve zümre paylaşımına dönüştürmen beklenir.`
  ][Math.max(0,Math.min(3,Number(score)||0))];
  if(preScore===null||preScore===undefined) return `${rl.label}: ${base}`;
  const d=(Number(score)||0)-(Number(preScore)||0);
  const deltaText=d>0?` Eğitim öncesine göre +${d} düzeylik olumlu değişim var; refleksin daha bütüncül bir pedagojik karara doğru gelişmiş.`:d===0?` Eğitim öncesiyle aynı düzey korunuyor. Bu, tek başına durağanlık anlamına gelmez; kalıcılığı gerçek sınıf uygulaması ve ürünlerle sınamak gerekir.`:` Bu ölçümde ${d} düzeylik değişim görülüyor. Bu sonuç tek başına gerileme kanıtı değildir; refleksi atölye çıktıları ve sınıf bağlamıyla yeniden değerlendirmek yararlı olacaktır.`;
  return `${rl.label}: ${base}${deltaText}`;
}

function uid(){ return (crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`); }
function code(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out='';
  for(let i=0;i<8;i++) out+=chars[Math.floor(Math.random()*chars.length)];
  return out;
}
function nowIso(){return new Date().toISOString();}
function formatDate(iso){return new Intl.DateTimeFormat('tr-TR',{dateStyle:'long',timeStyle:'short'}).format(new Date(iso));}
function levelFor(score){
  if(score<40)return {name:'Keşifçi Öğretmen',icon:'sprout'};
  if(score<55)return {name:'Gelişim Yolunda',icon:'compass'};
  if(score<70)return {name:'Maarif Uygulayıcısı',icon:'tools'};
  if(score<85)return {name:'Öğrenme Tasarımcısı',icon:'target'};
  return {name:'Maarif Dönüşüm Öncüsü',icon:'rocket'};
}
function scoreSession(session){
  const raw=session.answers.reduce((s,a)=>s+(a.score||0),0);
  const totalScore=Math.round(raw/(QUESTIONS.length*3)*100);
  const categoryScores={};
  for(const c of CATEGORIES){
    const qs=QUESTIONS.filter(q=>q.category===c.key); const ans=session.answers.filter(a=>qs.some(q=>q.id===a.questionId));
    const r=ans.reduce((s,a)=>s+(a.score||0),0); categoryScores[c.key]=Math.round(r/(qs.length*3)*100);
  }
  return {raw,totalScore,categoryScores,level:levelFor(totalScore).name};
}
function rankings(categoryScores){
  const list=CATEGORIES.map(c=>({...c,score:categoryScores[c.key]||0})).sort((a,b)=>b.score-a.score);
  return {top:list.slice(0,2),bottom:[...list].sort((a,b)=>a.score-b.score).slice(0,2),route:[...list].sort((a,b)=>a.score-b.score).slice(0,3)};
}
function personalMessage(session){
  const s=session.totalScore, r=rankings(session.categoryScores), strong=r.top[0]?.short, growth=r.bottom[0]?.short;
  if(s<40)return `Yeni yaklaşımları keşfetmeye açık güçlü bir başlangıç noktasındasın. ${growth} alanındaki eğitim, sınıf pratiğine hızlı bir gelişim alanı açabilir.`;
  if(s<55)return `Temel farkındalığın oluşmuş durumda. ${strong} alanındaki gücünü korurken ${growth} başlığını uygulama repertuvarına eklemek seni hızla ileri taşıyabilir.`;
  if(s<70)return `Birçok yaklaşımı doğru yönde kullanıyorsun. Şimdi asıl fırsat, ${growth} alanındaki uygulamalarını daha sistematik ve görünür hâle getirmek.`;
  if(s<85)return `Öğrenme tasarımı yaklaşımın güçlü. ${strong} öne çıkıyor; ${growth} alanındaki küçük bir gelişim bile bütüncül tasarım gücünü belirgin biçimde artırabilir.`;
  return `Maarif yaklaşımını bütüncül tasarlama eğilimin oldukça güçlü. ${strong} alanındaki yetkinliğini zümre paylaşımı ve örnek uygulama üretimiyle çoğaltman yüksek değer üretebilir.`;
}

function allRadarSessions(){
  const map=new Map();
  try{
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key||!key.startsWith('biltekMaarifRadarSessionsV'))continue;
      try{
        const rows=JSON.parse(localStorage.getItem(key)||'[]');
        if(Array.isArray(rows))rows.forEach(s=>{if(s?.id&&s?.completedAt&&Number.isFinite(Number(s.totalScore)))map.set(s.id,s);});
      }catch{}
    }
  }catch{}
  try{localSessions().forEach(s=>{if(s?.id&&s?.completedAt)map.set(s.id,s);});}catch{}
  return [...map.values()].sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));
}

function dashboardPairs(){
  const groups=new Map();
  allRadarSessions().forEach(s=>{
    const code=(s.participantCode||'').toUpperCase()||s.id;
    if(!groups.has(code))groups.set(code,{code,pre:[],post:[]});
    groups.get(code)[s.mode==='post'?'post':'pre'].push(s);
  });
  return [...groups.values()].map(g=>{
    const pre=[...g.pre].sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt))[0]||null;
    const post=[...g.post].sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt))[0]||null;
    const info=post?.teacherInfo||pre?.teacherInfo||{};
    const delta=pre&&post?post.totalScore-pre.totalScore:null;
    return {
      code:g.code,pre,post,info,
      preScore:pre?.totalScore??null,postScore:post?.totalScore??null,delta,
      status:post?'Tamamlandı':pre?'Eğitim Sonrası Bekleniyor':'Kayıt',
      current:post||pre
    };
  }).sort((a,b)=>{
    const da=new Date(a.post?.completedAt||a.pre?.completedAt||0);
    const db=new Date(b.post?.completedAt||b.pre?.completedAt||0);
    return db-da;
  });
}

function avg(nums){
  const clean=nums.filter(v=>Number.isFinite(Number(v))).map(Number);
  return clean.length?Math.round(clean.reduce((s,v)=>s+v,0)/clean.length):0;
}
function dashboardCategoryStats(rows){
  const paired=rows.filter(r=>r.pre&&r.post);
  return CATEGORIES.map(c=>{
    const preAvg=avg(paired.map(r=>r.pre.categoryScores?.[c.key]));
    const postAvg=avg(paired.map(r=>r.post.categoryScores?.[c.key]));
    return {...c,preAvg,postAvg,delta:paired.length?postAvg-preAvg:null};
  });
}
function dashboardKpis(rows){
  const paired=rows.filter(r=>r.pre&&r.post);
  const preRows=rows.filter(r=>r.pre);
  const postRows=rows.filter(r=>r.post);
  const preAvg=avg(paired.map(r=>r.preScore));
  const postAvg=avg(paired.map(r=>r.postScore));
  const avgDelta=paired.length?Math.round(paired.reduce((s,r)=>s+r.delta,0)/paired.length):0;
  const improved=paired.filter(r=>r.delta>0).length;
  return {
    participants:rows.length,
    preCount:preRows.length,
    postCount:postRows.length,
    pairedCount:paired.length,
    preAvg,postAvg,avgDelta,
    improvementRate:paired.length?Math.round(improved/paired.length*100):0
  };
}
function participantCategoryDeltas(row){
  return CATEGORIES.map(c=>{
    const pre=row.pre?.categoryScores?.[c.key]??null;
    const post=row.post?.categoryScores?.[c.key]??null;
    const current=post??pre??0;
    return {...c,pre,post,current,delta:pre!==null&&post!==null?post-pre:null};
  });
}
function actionPriority(score,delta){
  if(score<40)return {label:'Yüksek Öncelik',className:'high'};
  if(delta!==null&&delta<=0&&score<70)return {label:'Yeniden Müdahale',className:'high'};
  if(score<55)return {label:'Öncelikli Gelişim',className:'medium'};
  if(score<70)return {label:'Sistematikleştir',className:'medium'};
  if(score<85)return {label:'Pekiştir',className:'good'};
  return {label:'Paylaş & Yaygınlaştır',className:'excellent'};
}
function smartParticipantRecommendation(row){
  if(!row.post){
    return {
      priority:{label:'Karşılaştırma Bekleniyor',className:'waiting'},
      category:null,
      title:'Önce eğitim sonrası ölçümü tamamla',
      reason:'Eğitim öncesi başlangıç skoru mevcut; öğrenme farkını aksiyona çevirmek için aynı gelişim koduyla eğitim sonrası radarı tamamlamak gerekiyor.',
      action:'Eğitim sonrasında aynı gelişim koduyla ikinci ölçümü tamamla.',
      evidence:'Önce–sonra toplam skor ve 6 yetkinlik alanı değişimi',
      followup:'Karşılaştırma tamamlanınca sistem otomatik olarak öncelikli gelişim aksiyonunu oluşturacaktır.'
    };
  }
  const stats=participantCategoryDeltas(row);
  const ranked=[...stats].sort((a,b)=>{
    const needA=(100-a.current)+(a.delta!==null&&a.delta<=0?25:0)-(a.delta||0)*.7;
    const needB=(100-b.current)+(b.delta!==null&&b.delta<=0?25:0)-(b.delta||0)*.7;
    return needB-needA;
  });
  const target=ranked[0], lib=DEVELOPMENT_ACTIONS[target.key];
  const p=actionPriority(target.current,target.delta);
  const deltaText=target.delta===null?'başlangıç skoru üzerinden':target.delta>0?`+${target.delta} puan gelişime rağmen`:`${target.delta} puan değişimle`;
  return {
    priority:p,category:target,
    title:lib.title,
    reason:`${target.name} alanı ${target.current}/100 düzeyinde ve ${deltaText} gelişim açısından en yüksek aksiyon değerini taşıyor.`,
    action:lib.action,evidence:lib.evidence,followup:lib.followup
  };
}
function groupSmartRecommendations(rows){
  const paired=rows.filter(r=>r.pre&&r.post);
  if(!paired.length)return [];
  const stats=dashboardCategoryStats(rows);
  return stats.map(c=>{
    const need=(100-c.postAvg)*.7 + Math.max(0,10-(c.delta??0))*1.4;
    return {...c,need,lib:DEVELOPMENT_ACTIONS[c.key]};
  }).sort((a,b)=>b.need-a.need).slice(0,3);
}
function uniqueDashboardValues(rows,key){
  return [...new Set(rows.map(r=>(r.info?.[key]||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'tr'));
}
function dashboardOptionList(values,selected){
  return `<option value="">Tümü</option>${values.map(v=>`<option value="${escapeHtml(v)}" ${selected===v?'selected':''}>${escapeHtml(v)}</option>`).join('')}`;
}
function getDashboardFilters(){
  return {
    q:(document.getElementById('dashSearch')?.value||'').trim().toLocaleLowerCase('tr-TR'),
    campus:document.getElementById('dashCampus')?.value||'',
    branch:document.getElementById('dashBranch')?.value||'',
    level:document.getElementById('dashLevel')?.value||'',
    status:document.getElementById('dashStatus')?.value||''
  };
}
function filterDashboardRows(rows,f){
  return rows.filter(r=>{
    const hay=[r.info?.name,r.info?.campus,r.info?.branch,r.info?.level,r.code].join(' ').toLocaleLowerCase('tr-TR');
    if(f.q&&!hay.includes(f.q))return false;
    if(f.campus&&r.info?.campus!==f.campus)return false;
    if(f.branch&&r.info?.branch!==f.branch)return false;
    if(f.level&&r.info?.level!==f.level)return false;
    if(f.status&&r.status!==f.status)return false;
    return true;
  });
}
function deltaText(v){
  if(v===null||v===undefined)return '—';
  return `${v>0?'+':''}${v}`;
}

function dashboardGroupRecommendationsHtml(rows){
  const recs=groupSmartRecommendations(rows);
  if(!recs.length)return `<div class="dash-empty-small">Akıllı grup önerisi için en az bir eğitim öncesi–sonrası eşleşmesi gerekiyor.</div>`;

}

let audioCtx=null;
function ensureAudio(){
  if(!state.soundEnabled)return null;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch{return null}
}
function playTone(freq=700,duration=.08,gain=.035,type='sine'){
  if(!state.soundEnabled)return;
  const ctx=ensureAudio(); if(!ctx)return;
  const osc=ctx.createOscillator(),g=ctx.createGain();
  osc.type=type;osc.frequency.value=freq;g.gain.value=gain;
  osc.connect(g);g.connect(ctx.destination);
  const t=ctx.currentTime;g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  osc.start(t);osc.stop(t+duration+.02);
}

function deterministicShuffle(arr, seedText){
  let h=2166136261; for(let i=0;i<seedText.length;i++){h^=seedText.charCodeAt(i);h=Math.imul(h,16777619)}
  const out=[...arr]; let seed=h>>>0; const rnd=()=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296};
  for(let i=out.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[out[i],out[j]]=[out[j],out[i]];} return out;
}

function awarenessPersonalization(afterQuestion){
  const start=afterQuestion-5,end=afterQuestion;
  const blockQuestions=QUESTIONS.slice(start,end);
  const blockAnswers=blockQuestions.map(q=>state.session.answers.find(a=>a.questionId===q.id)||{score:0,timedOut:true});
  const scores=blockAnswers.map(a=>a.score||0);
  const avg=scores.reduce((s,v)=>s+v,0)/scores.length;
  const timedOut=blockAnswers.filter(a=>a.timedOut).length;
  const strong=blockAnswers.filter(a=>a.score===3).length;
  const exploratory=blockAnswers.filter(a=>a.score<=1).length;
  let title='Sana Özel Gözlem';
  let text='';
  if(avg>=2.4&&timedOut===0){
    title='Sana Özel Gözlem • Güçlü eğilim';
    text='Bu alanda cevapların daha bütüncül ve pedagojik açıdan sistemli bir yaklaşım gösteriyor. Akademi sürecinde bu gücünü örnek ürünlere ve zümre paylaşımına dönüştürmen beklenir.';
  }else if(avg>=1.6){
    title='Sana Özel Gözlem • Gelişen farkındalık';
    text='Bu alanda temel düşünme yönün güçlü; ancak bazı cevapların daha bütüncül pedagojik karar düzeyine yaklaşırken bazıları daha operasyonel kaldı. Akademi atölyeleri bu geçişi netleştirecek.';
  }else{
    title='Sana Özel Gözlem • Keşif fırsatı';
    text='Bu alandaki cevapların, pedagojik kararını daha çok pratik akış veya hazır çözüm üzerinden kurduğunu gösteriyor. Akademi sürecinde bu alan, neden–beceri–kanıt ilişkisini daha sistemli kurman için önemli bir gelişim fırsatı sunar.';
  }
  if(timedOut>=2){
    text += ' Ayrıca bu bölümde birkaç soruyu süre içinde tamamlayamadın; sonuçlarını yorumlarken zaman baskısının etkisi olabileceğini de dikkate al.';

  }
  return {title,text};
}

function radarSvg(scores){
  const cx=230,cy=190,r=140,n=6; const pts=[]; for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;const v=(scores[CATEGORIES[i].key]||0)/100;pts.push([cx+Math.cos(a)*r*v,cy+Math.sin(a)*r*v]);}
  const grids=[.25,.5,.75,1].map(g=>`<polygon points="${Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return `${cx+Math.cos(a)*r*g},${cy+Math.sin(a)*r*g}`}).join(' ')}" fill="none" stroke="#dbe3ee" stroke-width="1"/>`).join('');
  const axes=Array.from({length:n},(_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;return `<line x1="${cx}" y1="${cy}" x2="${cx+Math.cos(a)*r}" y2="${cy+Math.sin(a)*r}" stroke="#e3e9f1"/>`}).join('');
  const labels=CATEGORIES.map((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;const x=cx+Math.cos(a)*(r+38),y=cy+Math.sin(a)*(r+32);return `<text x="${x}" y="${y}" text-anchor="middle" font-size="11" font-weight="700" fill="#53617d">${escapeHtml(c.short.length>18?c.short.slice(0,17)+'…':c.short)}</text>`}).join('');
  return `<svg class="radar" viewBox="0 0 460 390" role="img" aria-label="6 yetkinlik radar grafiği">${grids}${axes}<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(255,106,0,.20)" stroke="#19D5C1" stroke-width="3"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#5B2CFF"/>`).join('')}${labels}</svg>`;
}

function dataUrlToBlobSync(dataUrl){
  const parts=dataUrl.split(',');
  const mime=(parts[0].match(/data:([^;]+)/)||[])[1]||'application/octet-stream';
  const binary=atob(parts[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
function ensureReportObjectUrl(blob){
  if(reportCache.url)return reportCache.url;
  reportCache.url=URL.createObjectURL(blob);

}

async function shareFileRobust(blob,name,title){
  try{
    if(!navigator.share)return false;
    const file=new File([blob],name,{type:blob.type||'application/octet-stream'});
    if(navigator.canShare && !navigator.canShare({files:[file]}))return false;
    await navigator.share({files:[file],title});
    return true;
  }catch{return false}
}
function legacyCopyImage(dataUrl){
  try{
    const holder=document.createElement('div');
    holder.contentEditable='true';
    holder.style.position='fixed';
    holder.style.left='-9999px';
    holder.style.top='0';
    holder.innerHTML=`<img src="${dataUrl}" alt="Sonuç kartı">`;
    document.body.appendChild(holder);
    const range=document.createRange();
    range.selectNodeContents(holder);
    const sel=window.getSelection();
    sel.removeAllRanges();sel.addRange(range);
    const ok=document.execCommand('copy');
    sel.removeAllRanges();
    holder.remove();
    return !!ok;
  }catch{return false}
}

function triggerBlobDownload(blob,filename){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=filename;
    a.rel='noopener';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},1200);
    return true;
  }catch(e){
    console.error(e);
    return false;
  }

      setTimeout(()=>{ if(document.body.contains(frame)) frame.remove(); },300);
    };

    const doPrint=()=>{
      try{
        const w=frame.contentWindow;
        w.focus();
        let finished=false;
        const after=()=>{
          if(finished)return;
          finished=true;
          w.removeEventListener('afterprint',after);
          cleanup();
        };
        w.addEventListener('afterprint',after);
        w.print();
        setTimeout(after,120000);
      }catch(e){
        console.error(e);
        cleanup();
        toast('Yazdırma ekranı açılamadı. Tarayıcı ayarlarınızı kontrol edin.','error');
      }

function invalidateReportCache(){
  if(reportCache.url)URL.revokeObjectURL(reportCache.url);
  reportCache={key:null,blob:null,url:null,previewCanvases:null};
}
function reportCacheKey(){
  const s=state.session; return `${s?.id||''}:${s?.completedAt||''}:${s?.developmentNote||''}:${state.preSession?.completedAt||''}`;
}
async function getReportBlob(){
  const key=reportCacheKey();
  if(reportCache.key===key&&reportCache.blob)return reportCache.blob;
  const assets=await generateReportAssets(state.session,state.preSession,{buildPdf:true});
  invalidateReportCache();
  reportCache={key,blob:assets.blob||null,url:null,previewCanvases:assets.previewCanvases};
  return assets.blob;
}
async function ensureReportAssets(){
  const key=reportCacheKey();
  if(reportCache.key===key&&reportCache.previewCanvases?.length)return reportCache;
  toast('Ayrıntılı kullanıcı raporu hazırlanıyor…');
  const assets=await generateReportAssets(state.session,state.preSession,{buildPdf:false});
  invalidateReportCache();
  reportCache={key,blob:assets.blob||null,url:null,previewCanvases:assets.previewCanvases};
  return reportCache;
}

function reportFilename(s){return `BILTEK-Maarif-Ogretmen-Egilim-Gelisim-Gostergesi-${safeName(s.teacherInfo.name)}-${s.mode==='pre'?'Egitim-Oncesi':'Egitim-Sonrasi'}.pdf`}
function safeName(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'ogretmen'}

async function generateReportAssets(session,pre,opts={buildPdf:false}){
  session.developmentNote=document.getElementById('developmentNote')?.value?.trim()||session.developmentNote||'';
  const jpegs=[],previewCanvases=[]; let pageNo=1;
  const addPage=(canvas)=>{
    const exportCanvas=document.createElement('canvas');
    exportCanvas.width=900;exportCanvas.height=1273;
    exportCanvas.getContext('2d').drawImage(canvas,0,0,900,1273);
    const preview=document.createElement('canvas');
    preview.width=558;preview.height=789;
    preview.getContext('2d').drawImage(exportCanvas,0,0,558,789);
    previewCanvases.push(preview);
    if(opts.buildPdf)jpegs.push(dataUrlBytes(exportCanvas.toDataURL('image/jpeg',.80)));
  };
  addPage(reportCover(session,pageNo++));
  addPage(reportSummary(session,pre,pageNo++));
  addPage(reportCategoryInterpretations(session,pre,0,2,pageNo++));
  addPage(reportCategoryInterpretations(session,pre,2,4,pageNo++));
  addPage(reportCategoryInterpretations(session,pre,4,6,pageNo++));
  for(let i=0;i<QUESTIONS.length;i+=2){
    addPage(reportQuestionPage(session,pre,i,i+2,pageNo++));
    if(i%4===0)await new Promise(r=>setTimeout(r,0));
  }
  addPage(reportDevelopmentMap(session,pre,pageNo++));
  addPage(reportClosing(session,pre,pageNo++));
  return {blob: opts.buildPdf ? buildPdfFromJpegs(jpegs,900,1273) : null, previewCanvases};
}
async function generateReportPdf(session,pre){
  const assets=await generateReportAssets(session,pre,{buildPdf:true});
  return assets.blob;
}

async function copyTextRobust(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch{}
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.setAttribute('readonly','');
    ta.style.position='fixed';
    ta.style.left='-9999px';
    ta.style.top='0';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok=document.execCommand('copy');
    document.body.removeChild(ta);
    return !!ok;
  }catch{return false}
}

}

async function visiteenRpc(name,payload={}){
  const response=await fetch(`${VISITEEN_DB_URL}/rest/v1/rpc/${name}`,{
    method:'POST',
    headers:{
      'apikey':VISITEEN_DB_ANON_KEY,
      'Authorization':`Bearer ${VISITEEN_DB_ANON_KEY}`,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(payload)

  try{ data=await response.json(); }catch{}

async function startPre(){
  const t=readTeacher();
  const institutionCode=(document.getElementById('institutionCode')?.value||'').trim().toUpperCase();
  if(!institutionCode)return toast('Lütfen kurum kodunu girin.','error');

async function saveCompletedSessionToCentral(){
  const s=state.session;
  if(s.mode==='pre'){
    const result=await visiteenRpc('start_pre_radar',{
      p_institution_code:s.institutionCode,
      p_teacher_name:s.teacherInfo.name,
      p_teacher_email:s.teacherInfo.email||'',
      p_branch:s.teacherInfo.branch,
      p_campus:s.teacherInfo.campus,
      p_level:s.teacherInfo.level,
      p_total_score:s.totalScore,
      p_category_scores:s.categoryScores,
      p_answers:s.answers,
      p_development_note:s.developmentNote||null
    });
    if(!result?.ok)throw new Error(result?.error||'Eğitim öncesi sonuç kaydedilemedi.');
    s.participantCode=result.growth_code;
    s.centralJourneyId=result.journey_id;
    s.institutionId=result.institution?.id||s.institutionId;
    s.institutionName=result.institution?.name||s.institutionName;
    s.institutionCode=result.institution?.code||s.institutionCode;
    return result;
  }
  const result=await visiteenRpc('save_post_radar',{
    p_growth_code:s.participantCode,
    p_total_score:s.totalScore,
    p_category_scores:s.categoryScores,
    p_answers:s.answers,
    p_development_note:s.developmentNote||null
  });
  if(!result?.ok)throw new Error(result?.error||'Eğitim sonrası sonuç kaydedilemedi.');
  return result;
}

async function openManagerTeacherReport(journeyId){
  if(!journeyId)return toast('Öğretmen kayıt kimliği bulunamadı.','error');
  const auth=centralManagerSession();
  if(!auth?.token)return openDashboardAdminLogin();

  const button=[...document.querySelectorAll('[data-dash-report]')].find(b=>b.dataset.dashReport===journeyId)||null;
  const previous=button?.innerHTML;
  if(button){button.disabled=true;button.innerHTML=`${uiIcon('report')}<span>Karne hazırlanıyor…</span>`;}

  try{
    const data=await visiteenRpc('manager_teacher_report',{p_token:auth.token,p_journey_id:journeyId});
    if(!data?.ok)throw new Error(data?.error||'Gelişim karnesi alınamadı.');

    const pre=centralReportSession(data.journey,data.pre,'pre');
    const post=centralReportSession(data.journey,data.post,'post');
    const reportSession=post||pre;
    if(!reportSession)throw new Error('Öğretmenin tamamlanmış Radar kaydı bulunamadı.');

    if(post&&pre)post.linkedPreSessionId=pre.id;

    openHtmlDetailedReport(reportSession,post?pre:null);
    toast(`${data.journey.teacher_name} için gelişim karnesi açıldı.`,'success');
  }catch(e){
    console.error(e);
    toast(e.message||'Gelişim karnesi açılamadı.','error');
  }finally{
    if(button){button.disabled=false;button.innerHTML=previous;}
  }
}

    b.onclick=()=>openParticipantActionDashboard(b.dataset.dashAction,rows);
  });
  document.querySelectorAll('[data-dash-report]').forEach(b=>{
    b.onclick=async(e)=>{
      e.preventDefault();
      e.stopPropagation();
      const journeyId=b.dataset.dashReport||'';
      if(!journeyId)return toast('Bu öğretmen kaydı için merkezi kayıt kimliği bulunamadı.','error');
      await openManagerTeacherReport(journeyId);
    };
  });
}


async function changeCurrentManagerPassword(){
  const auth=centralManagerSession();
  const current=document.getElementById('myCurrentPassword')?.value||'';
  const next=document.getElementById('myNewPassword')?.value||'';
  const next2=document.getElementById('myNewPassword2')?.value||'';
  if(next.length<10)return toast('Yeni şifre en az 10 karakter olmalı.','error');
  if(next!==next2)return toast('Yeni şifreler eşleşmiyor.','error');
  try{
    const r=await visiteenRpc('manager_change_password',{p_token:auth.token,p_current_password:current,p_new_password:next});
    if(!r?.ok)throw new Error(r?.error||'Şifre değiştirilemedi.');
    toast('Şifreniz başarıyla güncellendi.','success');
    ['myCurrentPassword','myNewPassword','myNewPassword2'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  }catch(e){toast(e.message||'Şifre değiştirilemedi.','error');}
}
async function resetManagerPassword(managerId,email){
  const password=prompt(`${email} için yeni geçici şifreyi girin.\nEn az 10 karakter olmalıdır.`);
  if(password===null)return;
  if(password.length<10)return toast('Şifre en az 10 karakter olmalı.','error');
  const auth=centralManagerSession();
  try{
    const r=await visiteenRpc('superadmin_reset_manager_password',{p_token:auth.token,p_manager_id:managerId,p_new_password:password});
    if(!r?.ok)throw new Error(r?.error||'Şifre sıfırlanamadı.');
    toast(`${email} için şifre sıfırlandı. Mevcut oturumları kapatıldı.`,'success');
  }catch(e){toast(e.message||'Şifre sıfırlanamadı.','error');}
}
async function toggleManagerActive(managerId,currentActive){
  const auth=centralManagerSession();
  const next=!currentActive;
  if(!confirm(`Bu yöneticiyi ${next?'aktif':'pasif'} hale getirmek istiyor musunuz?`))return;
  try{
    const r=await visiteenRpc('superadmin_set_manager_active',{p_token:auth.token,p_manager_id:managerId,p_active:next});
    if(!r?.ok)throw new Error(r?.error||'İşlem tamamlanamadı.');
    toast(`Yönetici ${next?'aktif':'pasif'} hale getirildi.`,'success');
    renderAcademyDashboard();
  }catch(e){toast(e.message||'İşlem tamamlanamadı.','error');}
}
async function toggleInstitutionActive(institutionId,currentActive){
  const auth=centralManagerSession();
  const next=!currentActive;
  const warning=next?'Kurumu tekrar aktif hale getirmek istiyor musunuz?':'Kurum pasif hale getirilecek. Kuruma bağlı yönetici hesapları da pasif olacaktır. Devam edilsin mi?';
  if(!confirm(warning))return;
  try{
    const r=await visiteenRpc('superadmin_set_institution_active',{p_token:auth.token,p_institution_id:institutionId,p_active:next});
    if(!r?.ok)throw new Error(r?.error||'İşlem tamamlanamadı.');
    toast(`Kurum ${next?'aktif':'pasif'} hale getirildi.`,'success');
    renderAcademyDashboard();
  }catch(e){toast(e.message||'İşlem tamamlanamadı.','error');}
}
function bindManagementCenter(){
  const search=document.getElementById('managementSearch');
  let activeTab='all';
  const apply=()=>{
    const q=(search?.value||'').trim().toLowerCase();
    document.querySelectorAll('#managementGrid [data-mgmt-kind]').forEach(card=>{
      const matchesTab=activeTab==='all'||card.dataset.mgmtKind===activeTab;
      const matchesSearch=!q||(card.dataset.search||'').includes(q);
      card.style.display=matchesTab&&matchesSearch?'':'none';
    });
  };
  search?.addEventListener('input',apply);
  document.querySelectorAll('[data-mgmt-tab]').forEach(btn=>btn.onclick=()=>{
    activeTab=btn.dataset.mgmtTab;
    document.querySelectorAll('[data-mgmt-tab]').forEach(b=>b.classList.toggle('active',b===btn));
    apply();
  });
  document.querySelectorAll('[data-manager-reset]').forEach(b=>b.onclick=()=>resetManagerPassword(b.dataset.managerReset,b.dataset.managerEmail));
  document.querySelectorAll('[data-manager-toggle]').forEach(b=>b.onclick=()=>toggleManagerActive(b.dataset.managerToggle,b.dataset.managerActive==='1'));
  document.querySelectorAll('[data-inst-toggle]').forEach(b=>b.onclick=()=>toggleInstitutionActive(b.dataset.instToggle,b.dataset.instActive==='1'));
}
async function renderAcademyDashboard(){
  clearTimers();state.screen='dashboard';
  const auth=centralManagerSession();
  if(!auth?.token){return openDashboardAdminLogin();}
  shell(`<section class="glass-card" style="padding:36px;text-align:center"><h2 style="color:var(--navy)">Merkezi Dashboard yükleniyor…</h2></section>`);
  try{
    const data=await visiteenRpc('manager_dashboard_data',{p_token:auth.token});
    if(!data?.ok)throw new Error(data?.error||'Dashboard verisi alınamadı.');
    const rows=dashboardRowsFromCentral(data);
    const isSuper=data.role==='super_admin';

    shell(`<section class="dashboard-page" id="academyDashboard">
      <div class="dashboard-hero">
        <div>
          <div class="dashboard-kicker">VISITEEN KURUMSAL KOÇLUK YÖNETİM PLATFORMU</div>
          <h1>${isSuper?'Visiteen Super Admin':'Akademi Etkisi YÖNETİCİ Dashboard’u'}</h1>
          <p>${isSuper?'Tüm kurumların Maarif Öğretmen Radarı etkisini merkezi olarak yönetin.':'Yalnız kurumunuza ait eğitim öncesi–sonrası gelişim verilerini görüntüleyin.'}</p>
          <div class="manager-role-badge">${isSuper?'SUPER ADMIN • TÜM KURUMLAR':escapeHtml(data.institutions?.[0]?.name||'KURUM YÖNETİCİSİ')}</div>
        </div>
        <div class="dashboard-hero-actions">
          <button class="btn btn-primary" id="dashPrint">${uiIcon('print')}Dashboard Raporu Al</button>
          <button class="btn btn-ghost" id="dashLogout">Güvenli Çıkış</button>
          <button class="btn btn-ghost" id="dashHome">${uiIcon('arrowLeft')}Ana Sayfa</button>
        </div>
      </div>

      <div class="dash-central-note">✓ Merkezi veri aktif • Öğretmenler farklı cihazlardan katılabilir • Gelişim Kodu cihazdan bağımsız çalışır.</div>

      ${isSuper?managerSecurityPanelHtml(data):''}
      ${isSuper?superAdminPanelHtml(data):''}

      <section class="dashboard-section">
        <div class="dashboard-section-head"><div><small>GENEL ETKİ</small><h2>Akademi Gelişim Özeti</h2></div></div>
        <div id="dashKpis">${dashboardKpiHtml(dashboardKpis(rows))}</div>
      </section>

      <section class="dashboard-section">
        <div class="dashboard-section-head"><div><small>6 YETKİNLİK ALANI</small><h2>Önce / Sonra Yetkinlik Görünümü</h2></div><span>Yalnız eşleşmiş ön–son kayıtlar üzerinden hesaplanır.</span></div>
        <div id="dashCategories">${dashboardCategoryHtml(rows)}</div>
      </section>

      <section class="dashboard-section smart-section">
        <div class="dashboard-section-head"><div><small>AKILLI YÖNLENDİRME MOTORU</small><h2>Kurumsal Gelişim İçin İlk 3 Aksiyon</h2></div><span>Skor seviyesi + değişim miktarı birlikte değerlendirilir.</span></div>
        <div id="dashGroupRecommendations">${dashboardGroupRecommendationsHtml(rows)}</div>
      </section>

      <section class="dashboard-section">
        <div class="dashboard-section-head"><div><small>KATILIMCI VERİSİ</small><h2>Öğretmen Gelişim Tablosu</h2></div><span id="dashResultCount">${rows.length} kayıt</span></div>
        <div class="dash-filters">
          <label class="dash-search"><span>${uiIcon('search')}</span><input id="dashSearch" placeholder="Öğretmen, kampüs, branş veya gelişim kodu ara"></label>
          ${isSuper?`<select id="dashInstitution"><option value="">Tüm Kurumlar</option>${(data.institutions||[]).map(i=>`<option value="${escapeHtml(i.id)}">${escapeHtml(i.name)}</option>`).join('')}</select>`:''}
          <select id="dashCampus">${dashboardOptionList(uniqueDashboardValues(rows,'campus'),'')}</select>
          <select id="dashBranch">${dashboardOptionList(uniqueDashboardValues(rows,'branch'),'')}</select>
          <select id="dashLevel">${dashboardOptionList(uniqueDashboardValues(rows,'level'),'')}</select>
          <select id="dashStatus"><option value="">Tüm Durumlar</option><option>Tamamlandı</option><option>Eğitim Sonrası Bekleniyor</option></select>
          <button class="btn btn-ghost" id="dashClear">Filtreleri Temizle</button>
        </div>
        <div id="dashTable">${dashboardTableHtml(rows)}</div>
      </section>
    </section>`);

    const currentRows=()=>{
      let filtered=filterDashboardRows(rows,getDashboardFilters());
      const inst=document.getElementById('dashInstitution')?.value||'';
      if(inst)filtered=filtered.filter(r=>r.institutionId===inst);
      return filtered;
    };
    const refresh=()=>{
      const filtered=currentRows();
      document.getElementById('dashResultCount').textContent=`${filtered.length} kayıt`;
      document.getElementById('dashTable').innerHTML=dashboardTableHtml(filtered);
      bindDashboardRowActions(rows);
    };
    ['dashSearch','dashInstitution','dashCampus','dashBranch','dashLevel','dashStatus'].forEach(id=>{
      const el=document.getElementById(id);if(el)el.addEventListener(id==='dashSearch'?'input':'change',refresh);
    });
    document.getElementById('dashClear').onclick=()=>{
      ['dashSearch','dashInstitution','dashCampus','dashBranch','dashLevel','dashStatus'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
      refresh();
    };
    document.getElementById('dashHome').onclick=renderHome;
    document.getElementById('dashLogout').onclick=logoutDashboardAdmin;
    document.getElementById('dashPrint').onclick=()=>printAcademyDashboard();
    const changePasswordBtn=document.getElementById('changeMyPassword');
    if(changePasswordBtn)changePasswordBtn.onclick=changeCurrentManagerPassword;

    if(isSuper){
      bindManagementCenter();
      document.getElementById('saCreateInstitution').onclick=async()=>{
        const name=(document.getElementById('saInstitutionName').value||'').trim();
        const code=(document.getElementById('saInstitutionCode').value||'').trim().toUpperCase();
        if(!name||!code)return toast('Kurum adı ve kurum kodunu girin.','error');
        try{
          const r=await visiteenRpc('superadmin_create_institution',{p_token:auth.token,p_code:code,p_name:name});
          if(!r?.ok)throw new Error(r?.error||'Kurum oluşturulamadı.');
          toast(`${r.name} oluşturuldu. Kod: ${r.code}`,'success');
          renderAcademyDashboard();
        }catch(e){toast(e.message||'Kurum oluşturulamadı.','error');}
      };
      document.getElementById('saCreateManager').onclick=async()=>{
        const institutionId=document.getElementById('saManagerInstitution').value;
        const fullName=(document.getElementById('saManagerName').value||'').trim();
        const email=(document.getElementById('saManagerEmail').value||'').trim();
        const password=document.getElementById('saManagerPassword').value||'';
        if(!institutionId||!email||password.length<10)return toast('Kurum, e-posta ve en az 10 karakterli şifre girin.','error');
        try{
          const r=await visiteenRpc('superadmin_create_manager',{p_token:auth.token,p_institution_id:institutionId,p_email:email,p_password:password,p_full_name:fullName||null});
          if(!r?.ok)throw new Error(r?.error||'Yönetici oluşturulamadı.');
          toast('Kurum yöneticisi oluşturuldu.','success');
          renderAcademyDashboard();
        }catch(e){toast(e.message||'Yönetici oluşturulamadı.','error');}
      };
    }
    refresh();
  }catch(e){
    console.error(e);
    setCentralManagerSession(null);
    toast(e.message||'Dashboard yüklenemedi.','error');
    renderHome();
  }
}

</script>
